name: Publish

# Runs when you publish a release on GitHub, and uploads the package to PyPI.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/secretwall
    permissions:
      contents: read
      id-token: write  # lets PyPI trust this workflow, so no password or token is needed
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
