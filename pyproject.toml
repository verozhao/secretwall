[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "secretwall"
dynamic = ["version"]
description = "Keep AI coding agents (Claude Code, Codex, Copilot, Cursor, Gemini CLI) away from your .env files and keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "agents", "secrets", "dotenv", "env", "security", "claude-code", "codex", "cursor",
            "copilot", "gemini-cli", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
]

[project.scripts]
secretwall = "secretwall.cli:main"

[tool.hatch.version]
path = "src/secretwall/hook.py"

[tool.hatch.build.targets.wheel]
packages = ["src/secretwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
